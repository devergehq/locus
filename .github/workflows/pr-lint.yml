name: PR lint

# The description check. Separate from ci.yml because it asks a different question of a
# different thing: ci.yml tests the code in the diff, this reads the prose around it, and the
# two have no triggers, permissions or runtime in common.
#
# WHY THESE THREE TRIGGERS. The failure this check exists to catch moves without a commit.
# A description is edited in the web UI, and the working notes arrive as a comment - by
# house style they are moved out of the body LATE, so the comment is the newest one on the
# pull request, days after the push. A `push`-only check reports on a description that no
# longer exists:
#
#   * `pull_request: [opened, reopened, synchronize]` - the pushes.
#   * `pull_request: [edited]` - the description, with no new commit. Also fires on a title
#     change, which costs one cheap re-run.
#   * `issue_comment: [created, edited, deleted]` - the working-notes comment appearing, and
#     also being edited or removed, which is what turns the body's link back into a dead one.
#
# WHAT `issue_comment` COSTS, and it is not nothing. GitHub runs an `issue_comment` workflow
# from the DEFAULT BRANCH only, and its `GITHUB_SHA` is master's rather than the pull
# request's head. Two consequences, both deliberate and neither fixable from this file:
#
#   1. A change to this workflow or to the action cannot be exercised through the comment
#      path until it is on `master`. On a pull request, only the `pull_request` triggers fire.
#   2. The comment-triggered run's result does not attach to the pull request head, so it
#      does not appear in the pull request's own check list. It is in the job summary and in
#      the Actions tab, which is where an author goes to read the findings anyway. The status
#      that branch protection would key on comes from the push and edit triggers.
#
# IT RUNS ON UBICLOUD. `ubicloud-standard-2`, through the organisation's Ubicloud GitHub
# App, like every other Linux job across the three repositories; macOS and Windows jobs
# stay on GitHub, which has the only runners for them. Switching back is the label alone --
# this job checks nothing out, builds nothing and reads the pull request over `gh api`, so
# the image underneath it is not load-bearing. See ci.yml's WHERE THIS RUNS, and
# `.github/actionlint.yaml`, which is what stops actionlint calling the label unknown.
#
# `pull_request`, NOT `pull_request_target`. The lint only ever reads, so the read-only
# GITHUB_TOKEN a fork's pull request gets is sufficient. `pull_request_target` would hand a
# WRITE token to a check that needs no writes, which is the documented way to turn a linter
# into a credential leak.
#
# A DRAFT PULL REQUEST IS NOT LINTED. The job is gated on the pull request not being a
# draft, so a draft push creates a run whose one job reports `skipped`. That is DEV-961, and
# it applies to the description for the same reason it applies to the code: the description
# of a pull request nobody can merge yet is still being written. `ready_for_review` joins the
# `types:` list, so the lint lands the moment the pull request is offered for review -- which
# is also the first moment its description is making a claim anybody is meant to act on.
#
# `reopened` is in the list because naming ANY type replaces the default set rather than
# adding to it. `converted_to_draft` is here to STOP a run rather than start one: taking a
# ready pull request back to draft fires no other event, so without it the lint from the last
# push keeps going, and with it the conversion fires a run that skips on the gate and -- same
# concurrency group, keyed on the pull request number -- cancels the one in flight. It can
# never start a run, because `draft == false` is false on that event by definition. `edited` is in the list for the reason three paragraphs up, and it is the one
# addition this workflow makes to the four triggers DEV-961 settled on across the three
# repositories: without it this check reports on a description that no longer exists.
#
# `issue_comment` is NOT draft-gated, and that is deliberate rather than an oversight. The
# working-notes comment is what the description's link points at, and a dead link in the body
# is worth saying on a draft; a comment is also not the push this ticket was filed about. If
# that ever needs gating, note that the issues-API representation of a pull request carries no
# `draft` field reachable from this payload, so it would take an API read rather than one more
# clause here.
#
# `workflow_dispatch` TAKES A PULL REQUEST NUMBER, unlike ci.yml's. This workflow lints a
# pull request rather than a tree, and the action hard-exits when the event carries no number
# -- so a bare manual trigger here would be a red run rather than a usable one. The number
# goes in by hand and is passed through as the action's `pr` input. GitHub only offers the
# trigger once the configuration is on the default branch, so it becomes usable when this
# merges, not while it is in review.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to lint.
        required: true
        type: string

# Read-only, and all three reads are load-bearing:
#   contents       - template discovery walks `repos/{repo}/contents/...`. Without it those
#                    probes 403, the linter cannot tell a 403 from a 404, and template
#                    checking silently finds nothing while the run still reports pass.
#   pull-requests  - the description and the diff size.
#   issues         - `repos/{repo}/issues/{n}/comments`, which is the issues API even for a
#                    pull request. Granted rather than guessed: the linter hard-exits 2 if
#                    that call fails, so being wrong here is a red check on every pull request.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Keyed on the PULL REQUEST NUMBER, not `github.ref`. The two event types carry different
  # refs - `refs/pull/N/merge` for `pull_request`, the default branch for `issue_comment` -
  # so a group keyed on the ref would never put a push and a comment in the same group, and a
  # stale run could land after a fresh one.
  # `inputs.pr` is last because it is only set on `workflow_dispatch`, where the other two
  # are empty; without it two hand-started runs on different pull requests would share the
  # group `pr-lint-` and cancel each other.
  group: pr-lint-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  # Safe here, unlike in ci.yml: this check reads live state from the API rather than from a
  # commit, so the newest run is always the authoritative one and a superseded run has
  # nothing to tell us.
  cancel-in-progress: true

jobs:
  description:
    name: description
    # Two guards, both written as negatives, and the shape is the point: each one names the
    # event it constrains and lets every other event through. The positive form this
    # replaced -- `github.event_name == 'pull_request' || (the issue_comment conditions)` --
    # was an allowlist of event names, so adding `workflow_dispatch` to the triggers above
    # would have silently excluded it from the job.
    #
    # First guard: `issue_comment` fires for issues as well as pull requests, and a comment on
    # a closed or merged pull request should not re-lint it for the rest of time.
    #
    # Second guard: the DEV-961 draft gate, verbatim as the three repositories agreed it.
    # `github.event.pull_request.draft == false` ALONE is silently true on every non-pull-request
    # event -- a missing property and `false` both coerce to 0 -- so it would let an
    # `issue_comment` or a `workflow_dispatch` through by accident rather than by intent.
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null && github.event.issue.state == 'open')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      # Needed only because the action is referenced by local path. The action itself reads
      # the pull request over the API and never touches the checked-out tree.
      #
      # On a pull request from a fork this checks out the fork's copy of the action and of
      # the linter, so a fork can make this check pass. That is the same trust model ci.yml
      # already runs under - `cargo test` on a fork's pull request runs the fork's tests -
      # and the control is the same one: the replacement is in the diff a human reads. An
      # external caller pins a SHA instead and does not inherit this; see the action's README.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint the description
        uses: ./.github/actions/pr-lint
        with:
          # Empty on every event that carries a pull request number of its own, which is
          # every event but `workflow_dispatch`; the action falls back to the event in that
          # case. See the action's `pr` input.
          pr: ${{ inputs.pr }}
