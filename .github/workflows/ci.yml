name: CI

# Per-PR checks. Kept separate from release.yml, which only fires on `v*` tags.
#
# Modelled on Allele's ci.yml, with three deliberate departures:
#
#   * No `architecture` job. That one gates Allele's tests/architecture.rs.
#     Locus has no equivalent test, and a job that asserts nothing is worse
#     than no job at all -- it reports green for work it never did.
#   * `rustfmt` and `clippy` run on ubuntu-latest, not macOS. Allele pins
#     macOS because it links cocoa/objc/core-text; Locus has no such
#     dependency, and release.yml already builds five targets. Linux runners
#     are faster and cheaper for platform-independent checks.
#   * `test` runs on both ubuntu-latest and macos-14. macOS is the primary
#     user platform and the hook/adapter code touches real filesystem paths,
#     so a Linux-only test run would miss the failures that matter most.
#
# All three are blocking. `clippy` was going to ship advisory
# (`continue-on-error: true`) until its warnings were cleared, and that turned
# out to be the wrong shape for two reasons, both measured rather than assumed.
#
# First, `continue-on-error` does not do what it is usually taken to do: on run
# 34730034287 the workflow RUN reported success while the clippy JOB and its
# check run both reported failure. It does not make a job green, it makes the
# run ignore a red job.
#
# Second, that would have meant a red X on every pull request, which is exactly
# the thing Allele's ci.yml warns about and for the right reason: "a
# permanently-red one is a check everyone learns to ignore." Shipping one here,
# in the workflow that introduces linting, would have been self-defeating.
#
# So the warnings were cleared in this PR instead and clippy is blocking from
# its first run. No count is written down -- a number in a comment is a
# precondition that rots.
#
# Toolchain install is NOT `rustup show`. Since rustup 1.28.0 (March 2025)
# rustup no longer auto-installs the toolchain named in rust-toolchain.toml, so
# `rustup show` alone leaves the job running whatever Rust the runner image
# happens to ship -- silently defeating the pin it appears to honour.
# `rustup show active-toolchain || rustup toolchain install` is the migration
# command from the 1.28.0 release notes. The explicit `rustup component add` is
# belt and braces: reports differ on whether a component-less install picks up
# the `components` key from the file, and a missing rustfmt fails the job
# outright. Both calls are idempotent.
#
# release.yml still uses bare `rustup show`. It has never run against the pin
# (the pin landed after the last release tag), so that is a latent failure on
# the next `v*` tag rather than a known-good pattern to copy. See DEV-611.
#
# WHEN THIS RUNS, and it is not "every push". A draft pull request runs
# NOTHING: every job below is gated on the pull request not being a draft, so a
# draft push creates a run whose jobs all report `skipped` and bills no minutes.
# Marking the pull request ready, and every push after that, runs the lot. This
# is DEV-961, and the number behind it is Review Desk's rather than this repo's:
# about 146 pushes across 17 branches over 11 and 12 October 2026, about 13
# billed minutes each, which took the organisation's 3,000 monthly minutes by
# the 13th. Locus is public and its minutes are free, so the saving here is not
# money -- it is one rule across all three repositories, and dozens of queued
# runs nobody reads not being queued.
#
# `push: branches: [master]` is deliberately ABSENT. A merge to `master` is the
# commit the ready pull request's own run already tested, so running it again
# tests nothing new. Two consequences to know about, neither of them a surprise
# at the time:
#
#   * There is no longer a run on `master` itself, so a check cannot be read off
#     the default branch. Read it off the pull request that produced the commit.
#   * NOTHING WRITES A `master`-SCOPED CACHE ANY MORE. Actions cache scoping
#     lets a pull request restore from the default branch's caches but keeps its
#     own scoped to its own ref, so `master`'s entries were the shared warm base
#     and were refreshed by the run this trigger removal deletes. They are now
#     frozen at the last one written before this change: every pull request
#     still restores them, and then rebuilds whatever has moved since. That is
#     slower, not more expensive -- this repository's minutes are free -- and
#     the fix if it ever matters is a scheduled or hand-started warming run.
#     Deliberately not added: a job whose only purpose is to keep a cache warm
#     is a job that bills on a schedule to save time nobody is waiting for.
#
# `reopened` is in the `types:` list because naming ANY type replaces the
# default set (`opened`, `synchronize`, `reopened`) rather than adding to it.
# Dropping it would mean a pull request closed and reopened ran nothing.
#
# `workflow_dispatch` is the escape hatch for a branch with no pull request.
# GitHub only offers it once the configuration is on the default branch, so it
# becomes usable when this merges, not while it is in review.
#
# None of these block a merge until they are marked as required status checks
# in the branch-protection rule for `master` -- a repo setting, not a file.
# Per the doctrine above, do not mark a check required until it is green.
# A skipped job satisfies a required check by design, which is what makes the
# draft gate safe to add before any such rule exists.
#
# The four contexts this workflow emits, for whoever fills in that rule. A
# matrix job reports one check per combination, so there is NO context named
# bare `test` and requiring one would never be satisfied:
#
#     rustfmt
#     clippy
#     test (ubuntu-latest)
#     test (macos-14)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a hand-started one. A
  # `workflow_dispatch` is somebody waiting on an answer about a specific ref;
  # cancelling it because a pull request on the same ref pushed would answer a
  # question nobody asked. The condition read `== 'pull_request'` when
  # `push: master` was still a trigger, for the same reason in the other
  # direction: a cancelled run reports as failed rather than skipped once these
  # are marked required, and that would have left a merge commit looking broken.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rustfmt:
    name: rustfmt
    # Draft pull requests run nothing; see "WHEN THIS RUNS" above. Written as a
    # negative guard because `github.event.pull_request.draft == false` ALONE is
    # silently true on every non-pull-request event -- a missing property and
    # `false` both coerce to 0 -- so it would pass by accident rather than by
    # intent on a `workflow_dispatch`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    # One job-level gate covers both matrix legs; a skipped matrix job reports
    # one skipped check per combination, exactly as a run one reports one each.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report both platforms. Knowing a failure is macOS-only is most of the
      # diagnosis; fail-fast would hide it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Run tests
        run: cargo test --workspace --all-features

      # The shell harnesses covering the Python skill scripts, which nothing ran until
      # DEV-794. That ticket's own finding was "nothing caught it, because nothing tested it", so
      # shipping a suite no job executes would have left the sentence true. They are added
      # together because the doctrine above allows it: all of them are green (1,766 assertions
      # across ten files, measured 13 October 2026 WITH NO review-desk ON PATH, which is what
      # this job has: `test-review-desk-hunks-and-parts.sh` runs a section against a real binary
      # when one is on PATH and counts 195 instead of 152, and
      # `test-dispatcher-review-desk.sh` runs one only when `REVIEW_DESK_BIN` names a path, so a
      # developer's machine counts higher and a developer with a half-built binary counts
      # failures this job will never see), and "do not mark a check required until it is green"
      # is about the check, not about how many files it covers. Each fakes a binary on PATH or
      # works on temp files, so none needs credentials, the network, or a built binary -- and
      # none reads a developer's own store, except the two sections named above, which use a
      # temporary database. The glob takes whatever is in scripts/, so a harness added later
      # needs no registration here; the count in this comment is the only thing that goes stale.
      - name: Run shell test harnesses
        run: |
          for f in scripts/test-*.sh; do
            echo "== $f"
            sh "$f"
          done
